<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - LitPlanz</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0a0a0f;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .container { width: 100%; max-width: 420px; }
        .logo { font-size: 28px; font-weight: 700; color: #a855f7; text-align: center; margin-bottom: 8px; }
        .tagline { text-align: center; color: #a0a0b0; font-size: 14px; margin-bottom: 40px; }
        .card {
            background: #141419;
            border-radius: 16px;
            padding: 40px 32px;
            border: 1px solid #2a2a35;
        }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        .subtitle { color: #a0a0b0; font-size: 15px; margin-bottom: 32px; line-height: 1.5; }
        label { display: block; font-size: 13px; color: #a0a0b0; margin-bottom: 8px; }
        input {
            width: 100%; padding: 14px 16px;
            background: #0a0a0f; border: 1px solid #2a2a35;
            border-radius: 10px; color: #ffffff; font-size: 16px;
            outline: none; transition: border-color 0.2s;
            margin-bottom: 20px;
        }
        input:focus { border-color: #a855f7; }
        .requirements { margin: -12px 0 20px; }
        .req {
            display: flex; align-items: center; gap: 6px;
            font-size: 12px; color: #606070; margin-bottom: 4px;
        }
        .req.met { color: #22c55e; }
        .req-dot { width: 6px; height: 6px; border-radius: 50%; background: #606070; flex-shrink: 0; }
        .req.met .req-dot { background: #22c55e; }
        .btn {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            color: #ffffff; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn:hover:not(:disabled) { opacity: 0.9; }
        .message {
            padding: 14px 16px; border-radius: 10px;
            font-size: 14px; line-height: 1.5; margin-bottom: 20px;
            display: none;
        }
        .message.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #f87171; }
        .message.success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #4ade80; }
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
            border-radius: 50%; animation: spin 0.7s linear infinite;
            display: inline-block; vertical-align: middle; margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .back-link { text-align: center; margin-top: 24px; }
        .back-link a { color: #a855f7; text-decoration: none; font-size: 14px; }
        .invalid-state { text-align: center; padding: 20px 0; }
        .invalid-state p { color: #a0a0b0; margin-bottom: 24px; line-height: 1.6; }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">LitPlanz</div>
    <div class="tagline">Discover your perfect night out</div>

    <div class="card" id="reset-card">
        <h1>Create New Password</h1>
        <p class="subtitle">Enter a new password for your LitPlanz account.</p>

        <div class="message error" id="error-msg"></div>
        <div class="message success" id="success-msg"></div>

        <div id="form-section" style="display:none">
            <label for="password">New Password</label>
            <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password">
            <div class="requirements">
                <div class="req" id="req-length"><div class="req-dot"></div>At least 8 characters</div>
                <div class="req" id="req-upper"><div class="req-dot"></div>One uppercase letter</div>
                <div class="req" id="req-number"><div class="req-dot"></div>One number</div>
            </div>

            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirm" placeholder="Repeat your password" autocomplete="new-password">

            <button class="btn" id="submit-btn" onclick="submitReset()" disabled>Reset Password</button>
        </div>

        <div id="invalid-section" class="invalid-state" style="display:none">
            <p>This reset link has expired or is invalid.<br>Please request a new password reset from the app.</p>
            <a href="https://litplanz.com" style="color:#a855f7;text-decoration:none;font-size:14px;">← Back to LitPlanz</a>
        </div>
    </div>

    <div class="back-link">
        <a href="https://litplanz.com">← Back to LitPlanz</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    var SUPABASE_URL = 'https://clktdigankjszupvrsqt.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsa3RkaWdhbmtqc3p1cHZyc3F0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcwMTY0MzcsImV4cCI6MjA4MjU5MjQzN30.lxRTafWUnKoQ4DBDTQEC9oioxYDejqtkT3apMC2Ervk';
    var client;
    var sessionReady = false;

    function getParams() {
        var params = {};
        new URLSearchParams(window.location.search).forEach(function(v, k) { params[k] = v; });
        if (window.location.hash) {
            new URLSearchParams(window.location.hash.replace('#', '')).forEach(function(v, k) { params[k] = v; });
        }
        return params;
    }

    async function init() {
        // Fetch the real anon key from meta or config
        client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        var params = getParams();
        var type = params.type || '';
        var accessToken = params.access_token;
        var refreshToken = params.refresh_token || '';
        var tokenHash = params.token_hash;
        var code = params.code;

        try {
            if (accessToken && type === 'recovery') {
                // Implicit flow: set session from access_token
                var result = await client.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
                if (result.error) throw result.error;
                sessionReady = true;
            } else if (tokenHash && type === 'recovery') {
                // PKCE/OTP flow: verify token hash
                var result = await client.auth.verifyOtp({ token_hash: tokenHash, type: 'recovery' });
                if (result.error) throw result.error;
                sessionReady = true;
            } else if (code) {
                // PKCE code exchange
                var result = await client.auth.exchangeCodeForSession(code);
                if (result.error) throw result.error;
                sessionReady = true;
            } else {
                showInvalid();
                return;
            }
            // Session established — show the form
            document.getElementById('form-section').style.display = 'block';
        } catch (e) {
            showInvalid();
        }
    }

    function showInvalid() {
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('invalid-section').style.display = 'block';
    }

    function showError(msg) {
        var el = document.getElementById('error-msg');
        el.textContent = msg;
        el.style.display = 'block';
        document.getElementById('success-msg').style.display = 'none';
    }

    function showSuccess(msg) {
        var el = document.getElementById('success-msg');
        el.textContent = msg;
        el.style.display = 'block';
        document.getElementById('error-msg').style.display = 'none';
    }

    document.getElementById('password').addEventListener('input', validateForm);
    document.getElementById('confirm').addEventListener('input', validateForm);

    function validateForm() {
        var pw = document.getElementById('password').value;
        var cn = document.getElementById('confirm').value;

        var lenOk = pw.length >= 8;
        var upperOk = /[A-Z]/.test(pw);
        var numOk = /[0-9]/.test(pw);

        setReq('req-length', lenOk);
        setReq('req-upper', upperOk);
        setReq('req-number', numOk);

        var valid = lenOk && upperOk && numOk && pw === cn && pw.length > 0;
        document.getElementById('submit-btn').disabled = !valid;
    }

    function setReq(id, met) {
        var el = document.getElementById(id);
        if (met) el.classList.add('met'); else el.classList.remove('met');
    }

    async function sendSuccessEmail(email, accessToken) {
        try {
            await fetch('https://clktdigankjszupvrsqt.supabase.co/functions/v1/send-notification', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + accessToken
                },
                body: JSON.stringify({
                    type: 'email',
                    to: email,
                    subject: 'Your LitPlanz password has been updated',
                    templateData: { template: 'password_reset_success' }
                })
            });
        } catch (_) {}
    }

    async function submitReset() {
        if (!sessionReady) { showError('Session expired. Please request a new reset link.'); return; }

        var pw = document.getElementById('password').value;
        var btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>Resetting...';

        try {
            var result = await client.auth.updateUser({ password: pw });
            if (result.error) throw result.error;

            // Fire success email (non-blocking)
            var sessionData = await client.auth.getSession();
            var userEmail = result.data.user && result.data.user.email;
            var accessToken = sessionData.data.session && sessionData.data.session.access_token;
            if (userEmail && accessToken) {
                sendSuccessEmail(userEmail, accessToken);
            }

            showSuccess('Password reset successfully! You can now sign in with your new password in the app.');
            document.getElementById('form-section').innerHTML =
                '<p style="color:#4ade80;text-align:center;line-height:1.8">✓ Password updated.<br><a href="https://litplanz.com" style="color:#a855f7">Return to LitPlanz →</a></p>';
        } catch (e) {
            showError(e.message || 'Reset failed. Please try again or request a new link.');
            btn.disabled = false;
            btn.innerHTML = 'Reset Password';
        }
    }

    init();
</script>
</body>
</html>
