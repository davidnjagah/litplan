<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LitPlanz - Opening App...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0a0a0f;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .container { text-align: center; max-width: 400px; width: 100%; }
        .icon {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px; font-size: 40px;
        }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
        p { font-size: 16px; color: #a0a0b0; line-height: 1.6; margin-bottom: 24px; }
        .btn {
            display: block; padding: 16px 40px;
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            color: #ffffff; text-decoration: none;
            font-size: 16px; font-weight: 600; border-radius: 12px;
            margin-bottom: 12px; width: 100%;
        }
        .btn-secondary {
            display: block; padding: 14px 40px;
            background: transparent;
            border: 1px solid #a855f7;
            color: #a855f7; text-decoration: none;
            font-size: 15px; font-weight: 600; border-radius: 12px;
            margin-bottom: 12px; width: 100%;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #2a2a35; border-top-color: #a855f7;
            border-radius: 50%; animation: spin 0.8s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .store-badge { display: block; margin: 16px auto 0; height: 44px; }
        .note { font-size: 13px; color: #606070; margin-top: 20px; }
    </style>
</head>
<body>
<div id="app"></div>

<script>
    function getParams() {
        var params = {};
        new URLSearchParams(window.location.search).forEach(function(v, k) { params[k] = v; });
        if (window.location.hash) {
            new URLSearchParams(window.location.hash.replace('#', '')).forEach(function(v, k) { params[k] = v; });
        }
        return params;
    }

    function buildDeepLink(params) {
        var type = params.type || 'recovery';
        var link = 'com.litplanz.app://auth-callback?type=' + encodeURIComponent(type);
        if (params.token_hash)    link += '&token_hash='    + encodeURIComponent(params.token_hash);
        if (params.token)         link += '&token='         + encodeURIComponent(params.token);
        if (params.access_token)  link += '&access_token='  + encodeURIComponent(params.access_token);
        if (params.refresh_token) link += '&refresh_token=' + encodeURIComponent(params.refresh_token);
        return link;
    }

    function buildSafariLink() {
        // Rebuilds current page URL with safari-https:// scheme to escape Gmail WebView
        var current = window.location.href.replace(/^https?:\/\//, '');
        return 'safari-https://' + current;
    }

    function isIOS() {
        return /iphone|ipad|ipod/i.test(navigator.userAgent);
    }

    function isDesktop() {
        return !/iphone|ipad|ipod|android/i.test(navigator.userAgent);
    }

    var labels = {
        recovery:  { h: 'Reset Your Password',      s: 'Open LitPlanz to set your new password.', btn: 'Open LitPlanz to Reset Password' },
        signup:    { h: 'Confirm Your Email',         s: 'Open LitPlanz to activate your account.', btn: 'Open LitPlanz to Confirm Email' },
        magiclink: { h: 'Sign In to LitPlanz',        s: 'Open LitPlanz to complete sign in.',       btn: 'Open LitPlanz to Sign In' },
        invite:    { h: 'You\'ve Been Invited',       s: 'Open LitPlanz to accept your invitation.', btn: 'Open LitPlanz to Accept' },
    };

    function render() {
        var params  = getParams();
        var type    = params.type || 'recovery';
        var copy    = labels[type] || labels.recovery;
        var deepLink = buildDeepLink(params);
        var el = document.getElementById('app');

        if (isDesktop()) {
            var webResetUrl = 'https://litplanz.com/auth/reset-password' + window.location.search + window.location.hash;
            el.innerHTML =
                '<div class="container">' +
                  '<div class="icon">🗺️</div>' +
                  '<h1>' + copy.h + '</h1>' +
                  (type === 'recovery'
                    ? '<p>Reset your password directly in the browser, or open this email on your iPhone to use the app.</p>' +
                      '<a href="' + webResetUrl + '" class="btn">Reset Password in Browser</a>'
                    : '<p>This link is designed to open the LitPlanz app on your iPhone. Please open this email on your iPhone and tap the button again.</p>') +
                  '<a href="https://apps.apple.com/app/litplanz/id6758998992" target="_blank" class="btn-secondary" style="margin-top:8px">Download LitPlanz on iPhone</a>' +
                '</div>';
            return;
        }

        // iOS — render the open-in-app page
        el.innerHTML =
            '<div class="container">' +
              '<div class="icon">🗺️</div>' +
              '<h1>' + copy.h + '</h1>' +
              '<p>' + copy.s + '</p>' +
              // Primary: direct deep link as <a> tag (works in Safari, sometimes in WebView)
              '<a href="' + deepLink + '" class="btn">' + copy.btn + '</a>' +
              // Secondary: escape Gmail WebView → open in Safari → Safari can open app
              '<a href="' + buildSafariLink() + '" class="btn-secondary">Open in Safari First</a>' +
              '<p style="font-size:13px;color:#606070;margin-top:8px;">If the button above doesn\'t open the app, tap "Open in Safari First" then try again.</p>' +
              // Tertiary: web-based reset for recovery flow
              (type === 'recovery' ? '<a href="https://litplanz.com/auth/reset-password' + window.location.search + window.location.hash + '" class="btn-secondary" style="margin-top:8px">Reset Password in Browser</a>' : '') +
              '<p style="font-size:13px;color:#606070;margin-top:20px;">Don\'t have the app?</p>' +
              '<a href="https://apps.apple.com/app/litplanz/id6758998992" target="_blank">' +
                '<img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download on the App Store" class="store-badge">' +
              '</a>' +
            '</div>';
    }

    render();
</script>
</body>
</html>
